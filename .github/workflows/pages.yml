# Publica a demonstração estática da vitrine (pasta pages/) no GitHub Pages.
# O sistema completo (Next.js + banco) não roda no Pages; precisa de um servidor.
name: Demonstração no GitHub Pages

on:
  push:
    branches: [main]
    paths: ["pages/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages
      - id: deploy
        uses: actions/deploy-pages@v4
